<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>史鉴 云端管理后台</title><style>body{margin:0;background:#f3f7f5;color:#17252d;font:14px/1.6 "Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.top h1{margin:5px 0;font-size:28px}.muted{color:#6c7d83;font-size:12px}.panel{background:#fff;border:1px solid #d9e4e3;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 12px 36px #173c5212}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#52666d;display:grid;gap:5px}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #d9e4e3;border-radius:8px;padding:9px;background:#fcfdfc;font:inherit}textarea{min-height:150px;resize:vertical}.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.primary{background:#1f7d6b;color:#fff}.ghost{background:#fff;border:1px solid #d9e4e3;color:#173d53}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:10px 0}.source{border:1px solid #d9e4e3;border-radius:10px;padding:11px;margin:8px 0;background:#fbfcfc}.source strong{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:10px 12px;border-radius:9px;background:#fdf6e4;color:#73561e;font-size:12px}.status{font-size:12px;color:#1f7d6b}@media(max-width:700px){.wrap{padding:15px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{display:block}}
</style></head><body><div class="wrap"><header class="top"><div><div class="muted">史鉴 · CLOUD ADMIN</div><h1>云端内容管理</h1><p class="muted">修改后所有成员刷新同一个网址即可看到。API 密钥不在这里填写，只由服务器环境变量保存。</p></div><div class="actions"><button class="btn ghost" id="back">返回统一网站</button><button class="btn primary" id="reload">刷新云端数据</button></div></header><div class="notice">只有管理员应该使用此页面。公开部署时请设置 SHIJIAN_ADMIN_TOKEN，并把令牌交给成员 1 或成员 2 保管。</div><section class="panel"><h2>管理员身份</h2><div class="grid"><label>管理令牌<input id="token" type="password" placeholder="本地启动脚本使用 local-dev；公网必须设置强令牌"></label><label>项目版本<input id="version" placeholder="例如 v0.2"></label></div></section><section class="panel"><h2>AI 行为规则</h2><p class="muted">这是系统提示词的可编辑版本。修改后智能体会按新规则回答。</p><textarea id="prompt"></textarea><div class="row"><span id="settingsStatus" class="status"></span><button class="btn primary" id="saveSettings">保存 AI 规则</button></div></section><section class="panel"><div class="row"><div><h2>云端史料</h2><p class="muted">成员 3 核验后再发布。修改后智能体下次打开会自动同步。</p></div><button class="btn ghost" id="addSource">添加史料</button></div><div id="sources"></div><div class="row"><span id="sourceStatus" class="status"></span><button class="btn primary" id="saveSources">保存全部史料</button></div></section></div><script>
(()=>{const $=s=>document.querySelector(s);let sources=[];const defaultPrompt='你是史鉴历史学习智能体。只使用给定 SOURCES。把关键结论标成事实、推断或争议；每个事实 claim 必须带 source_ids。资料不足时明确写资料不足，禁止虚构引用。只返回 JSON。';function headers(){return {'Content-Type':'application/json','X-Admin-Token':$('#token').value.trim()}}function msg(id,t){$(id).textContent=t;setTimeout(()=>$(id).textContent='',3000)}function sourceHtml(s,i){return `<article class="source"><div class="grid"><label>ID<input data-i="${i}" data-k="id" value="${esc(s.id)}"></label><label>标题<input data-i="${i}" data-k="title" value="${esc(s.title)}"></label><label>作者或机构<input data-i="${i}" data-k="author" value="${esc(s.author)}"></label><label>日期/时期<input data-i="${i}" data-k="date" value="${esc(s.date)}"></label><label>可靠性<select data-i="${i}" data-k="reliability"><option ${s.reliability==='教材/官方'?'selected':''}>教材/官方</option><option ${s.reliability==='权威出版物'?'selected':''}>权威出版物</option><option ${s.reliability==='待核验'?'selected':''}>待核验</option></select></label><label>页码或链接<input data-i="${i}" data-k="locator" value="${esc(s.locator)}"></label><label class="full">内容<textarea data-i="${i}" data-k="content">${esc(s.content)}</textarea></label></div></article>`}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){ $('#sources').innerHTML=sources.map(sourceHtml).join('');document.querySelectorAll('[data-i]').forEach(e=>e.oninput=()=>sources[+e.dataset.i][e.dataset.k]=e.value)}async function reload(){try{const [a,b]=await Promise.all([fetch('/api/settings',{cache:'no-store'}).then(r=>r.json()),fetch('/api/sources',{cache:'no-store'}).then(r=>r.json())]);$('#prompt').value=a.system_prompt||defaultPrompt;$('#version').value=a.version||'';sources=Array.isArray(b)?b:[];render();msg('#settingsStatus','已读取云端数据')}catch(e){msg('#settingsStatus','读取失败：'+e.message)}}$('#saveSettings').onclick=async()=>{try{const r=await fetch('/api/settings',{method:'POST',headers:headers(),body:JSON.stringify({system_prompt:$('#prompt').value,version:$('#version').value})});if(!r.ok)throw Error(await r.text());msg('#settingsStatus','AI 规则已保存')}catch(e){msg('#settingsStatus','保存失败：'+e.message)}};$('#saveSources').onclick=async()=>{try{const r=await fetch('/api/sources',{method:'POST',headers:headers(),body:JSON.stringify({items:sources})});if(!r.ok)throw Error(await r.text());msg('#sourceStatus','史料已保存')}catch(e){msg('#sourceStatus','保存失败：'+e.message)}};$('#addSource').onclick=()=>{sources.push({id:'S'+String(sources.length+1).padStart(3,'0'),title:'',author:'',date:'',locator:'',reliability:'待核验',content:''});render()};$('#reload').onclick=reload;$('#back').onclick=()=>location.href='史鉴团队网站.html';reload()})();
+</script></body></html>
