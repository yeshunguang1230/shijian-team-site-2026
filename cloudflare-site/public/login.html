<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成员登录 · 史鉴</title><link rel="stylesheet" href="site.css"></head><body><header class="site-header"><a class="brand" href="史鉴团队网站.html"><span class="brand-mark">史</span><span><strong>史鉴</strong><small>DEVELOPER WORKSPACE</small></span></a><a class="btn secondary" href="史鉴团队网站.html">返回首页</a></header><main class="auth-layout"><section class="auth-intro"><div class="eyebrow">团队，共同完成</div><h1>让每一次核验，<br>成为下一次理解的基础。</h1><p>三位开发者拥有各自的账号，在同一工作区维护史料、记录建议与完善学习体验。</p><div class="pill">一个网站 · 共同积累</div></section><section class="auth-card"><div id="loadingAuth" class="muted">正在检查登录状态…</div><section id="loginSection" hidden><h2>欢迎回来</h2><p class="muted">使用你的开发者账号登录。</p><form id="loginForm" class="form-stack"><label>账号<input name="username" autocomplete="username" required maxlength="100" placeholder="你的团队账号"></label><label>密码<input name="password" type="password" autocomplete="current-password" required placeholder="输入密码"></label><button class="btn" type="submit">登录开发者后台 →</button></form><div id="loginMessage" class="message" role="status"></div><hr><small>账号由项目负责人分配。忘记密码时，请联系负责人重置。</small></section><section id="passwordSection" hidden><div class="pill gold">保护你的账号</div><h2 style="margin-top:13px">设置自己的密码</h2><p class="muted" id="passwordIntro">首次登录后，请先更换初始密码，再进入工作区。</p><form id="passwordForm" class="form-stack"><label>当前密码<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>新密码<input name="newPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="128" placeholder="至少 10 位，建议使用长短语"></label><label>再次输入新密码<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></label><button class="btn" type="submit">保存密码并进入后台 →</button></form><div id="passwordMessage" class="message" role="status"></div><button id="passwordLogout" class="btn secondary" style="margin-top:18px" type="button">退出当前账号</button></section><section id="signedInSection" hidden><span class="pill">已登录</span><h2 id="signedInName" style="margin-top:14px"></h2><p class="muted">你可以继续处理共享资料和团队建议。</p><div class="form-stack"><a class="btn" href="admin.html">进入开发者后台 →</a><button id="showChangePassword" class="btn secondary">更换密码</button><button id="logout" class="btn secondary">退出登录</button></div><div id="sessionMessage" class="message" role="status"></div></section></section></main><script type="module" src="login.js"></script></body></html>
